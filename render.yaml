services:
  - type: web
    name: price-comparator
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://price-comparator-api-emsf.onrender.com

  - type: web
    name: price-comparator-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: price-comparator-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ML_ARTIFACT_DIR
        value: /opt/render/project/src/backend/ml_models
      - key: ML_TRAINING_ENABLED
        value: "true"
      - key: ML_TRAINING_PROFILE
        value: render_demo
      - key: ML_TRAINING_KEY
        sync: false
      - key: ML_MODEL_DELETE_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://price-comparator-dghc.onrender.com

  - type: web
    name: price-comparator-ml-lab
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install --force-reinstall streamlit==1.39.0 && python -c "import streamlit; print(streamlit.__version__)"
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless=true --global.developmentMode=false --browser.gatherUsageStats=false
    envVars:
      - key: STREAMLIT_SERVER_ENABLE_STATIC_SERVING
        value: "true"
      - key: FASTAPI_URL
        value: https://price-comparator-api-emsf.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: price-comparator-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: price-comparator-db
    databaseName: price_comparator
    user: price_comparator_user
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
